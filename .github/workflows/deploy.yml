name: Deploy

# CI success on main (or a manual run) notifies the status server
# (status.graybeardcorp.com), which owns the deploy: frontend on the Packer
# builder, AMI build, coordinator ASG roll, shard-fleet roll, health check —
# and, on success, triggers release.yml for the release artifacts.
#
# This workflow does nothing but POST the commit to status, authenticated by a
# GitHub Actions OIDC token (audience = the status host). No AWS creds, no
# kevcons, no build — all of that moved to status / release.yml.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  notify-status:
    # Only after a green CI run (workflow_run) or an explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the OIDC token the status webhook validates
    steps:
    - name: Notify status server
      env:
        STATUS_URL: https://status.graybeardcorp.com/webhook
        AUDIENCE: status.graybeardcorp.com
        # workflow_run carries the triggering commit; a manual dispatch uses the
        # ref it ran on.
        SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      run: |
        set -euo pipefail
        # Mint a GitHub Actions OIDC token scoped to the status audience. The
        # request URL + token are injected automatically with id-token: write.
        OIDC=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r '.value')
        if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then
          echo "failed to obtain OIDC token" >&2; exit 1
        fi
        echo "Triggering status deploy of weft @ $SHA"
        code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST "$STATUS_URL" \
          -H "Authorization: Bearer $OIDC" \
          -H "Content-Type: application/json" \
          -d "{\"app\":\"weft\",\"sha\":\"$SHA\"}")
        cat /tmp/resp.json || true; echo
        if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
          echo "status webhook returned HTTP $code" >&2; exit 1
        fi
        echo "status accepted the deploy (HTTP $code)"
