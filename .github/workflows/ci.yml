name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-flight CI runs for the same ref when a new push lands.
# Saves runner minutes; the latest commit is what matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-bump:
    name: Wire-bump tripwire
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout weft (full history for diff vs base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check wire-affecting changes bump a binary version
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          scripts/check-wire-bump.sh

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout weft
        uses: actions/checkout@v4
        with:
          path: weft
      - name: Checkout warp (sibling for go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: graybeardcorp/warp
          path: warp
          ssh-key: ${{ secrets.WARP_DEPLOY_KEY }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: weft/go.mod
          cache-dependency-path: weft/go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: WASM build check
        working-directory: weft
        run: GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
      - name: Start postgres (needed by store/coordinator/api unit tests)
        working-directory: weft
        run: |
          docker compose up -d postgres
          # Wait for ready. pg_isready reflects the postgres process,
          # which is good enough for store/test_db.go's ensureTestDatabase.
          until docker compose exec -T postgres pg_isready -U weft; do
            sleep 1
          done
      - name: go test ./...
        working-directory: weft
        env:
          # Several "unit" tests (shellfs, coordinator, parts of api)
          # call store.Open against the dev `weft` database and skip
          # when migrations haven't been applied yet — locally they
          # rely on the dev stack having been up. Enabling the
          # bootstrap path here lets them connect against the fresh
          # postgres we started above. store/* unit tests target
          # weft_test and set this themselves; this env var is the
          # umbrella for everyone else.
          WEFT_ALLOW_SCHEMA_BOOTSTRAP: "1"
        # -p 1 serializes package execution. Several test packages
        # (api/, shellfs/, store/team_perms_test, coordinator/) share
        # the `weft` database and call TruncateTestTables in cleanup;
        # running their binaries in parallel races. Within a single
        # package, tests still serialize (no t.Parallel()), so the
        # only cost of -p 1 is that non-DB packages can't fan out
        # alongside DB packages. CI cost: ~30s.
        run: |
          mkdir -p coverage/unit
          gotestsum --junitfile unit-report.xml -- -tags test -count=1 -timeout 10m -cover -coverpkg=./... -p 1 ./... -args -test.gocoverdir="$PWD/coverage/unit"
      - name: Stop postgres
        if: always()
        working-directory: weft
        run: docker compose down -v --remove-orphans
      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit test results
          path: unit-report.xml
          reporter: java-junit
          working-directory: weft
      - name: Upload unit coverage counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: weft/coverage/unit/
          # Warn (don't fail) when the unit suite died before any
          # counter files were dropped. The coverage job's gate will
          # then fail visibly on the missing data, not on the upload.
          if-no-files-found: warn

  integration:
    name: Integration (generic)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout weft
        uses: actions/checkout@v4
        with:
          path: weft
      - name: Checkout warp (sibling for go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: graybeardcorp/warp
          path: warp
          ssh-key: ${{ secrets.WARP_DEPLOY_KEY }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: weft/go.mod
          cache-dependency-path: weft/go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Compose up (base)
        working-directory: weft
        run: |
          docker compose up -d --build
          # Restart any service that crashed on the cold-start migration
          # race (api can lose to coordinator on goose up). Idempotent
          # for healthy services.
          sleep 5
          docker compose up -d
      - name: Run -tags integration
        working-directory: weft
        run: gotestsum --junitfile integration-report.xml -- -tags integration,test -count=1 -timeout 10m -v ./integration/
      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration (generic) results
          path: integration-report.xml
          reporter: java-junit
          working-directory: weft
      - name: Dump container logs on failure
        if: failure()
        working-directory: weft
        run: docker compose logs --tail=200
      - name: Compose down
        if: always()
        working-directory: weft
        run: docker compose down -v --remove-orphans

  integration-localstack:
    name: Integration (localstack)
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout weft
        uses: actions/checkout@v4
        with:
          path: weft
      - name: Checkout warp (sibling for go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: graybeardcorp/warp
          path: warp
          ssh-key: ${{ secrets.WARP_DEPLOY_KEY }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: weft/go.mod
          cache-dependency-path: weft/go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Compose up (base + localstack)
        working-directory: weft
        run: |
          docker compose -f docker-compose.yml -f docker-compose.localstack.yml up -d --build
          sleep 5
          docker compose -f docker-compose.yml -f docker-compose.localstack.yml up -d
      - name: Run -tags integration,localstack
        working-directory: weft
        run: gotestsum --junitfile localstack-report.xml -- -tags integration,localstack,test -count=1 -timeout 10m -v ./integration/
      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration (localstack) results
          path: localstack-report.xml
          reporter: java-junit
          working-directory: weft
      - name: Dump container logs on failure
        if: failure()
        working-directory: weft
        run: docker compose -f docker-compose.yml -f docker-compose.localstack.yml logs --tail=200
      - name: Compose down
        if: always()
        working-directory: weft
        run: docker compose -f docker-compose.yml -f docker-compose.localstack.yml down -v --remove-orphans

  integration-coverage:
    name: Integration (coverage)
    runs-on: ubuntu-latest
    # Depend on unit so we can merge its counters into the coverage
    # totals. Unit is the shorter of the two jobs, so the wait is small.
    needs: unit
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout weft
        uses: actions/checkout@v4
        with:
          path: weft
      - name: Checkout warp (sibling for go.mod replace)
        uses: actions/checkout@v4
        with:
          repository: graybeardcorp/warp
          path: warp
          ssh-key: ${{ secrets.WARP_DEPLOY_KEY }}
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: weft/go.mod
          cache-dependency-path: weft/go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Prepare per-service coverage dirs
        working-directory: weft
        run: mkdir -p coverage/{coordinator,shard-0,shard-1,compute,api}
      - name: Download unit coverage counters
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: weft/coverage/unit/
      - name: Compose up (base + localstack + cover)
        working-directory: weft
        run: |
          docker compose -f docker-compose.yml -f docker-compose.localstack.yml -f docker-compose.cover.yml up -d --build
          sleep 5
          docker compose -f docker-compose.yml -f docker-compose.localstack.yml -f docker-compose.cover.yml up -d
      - name: Run generic suite under coverage
        working-directory: weft
        run: gotestsum --junitfile coverage-generic-report.xml -- -tags integration,test -count=1 -timeout 10m -v ./integration/
      - name: Run localstack suite under coverage
        working-directory: weft
        run: gotestsum --junitfile coverage-localstack-report.xml -- -tags integration,localstack,test -count=1 -timeout 10m -v ./integration/
      - name: Test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration (coverage) results
          path: coverage-*-report.xml
          reporter: java-junit
          working-directory: weft
      - name: Stop stack (SIGTERM so Go counters flush)
        if: always()
        working-directory: weft
        run: docker compose -f docker-compose.yml -f docker-compose.localstack.yml -f docker-compose.cover.yml down --remove-orphans
      - name: Build coverage report
        working-directory: weft
        env:
          # Core coverage gate. Build fails if merged core % drops below
          # this. History (most recent first):
          #   2026-05-13  56.0% — shell + store gap-fill
          #   2026-05-13  54.3% — bootstrap + skip rewrite (post un-skip)
          #   2026-05-13  54.4% — gate introduced (with two CI=true skips)
          # The 3pt slack between gate and current absorbs ordinary
          # noise (sub-0.1pt across runs) plus an unrelated PR or two.
          # Bump when meaningful jumps land; don't chase 0.1pt moves.
          WEFT_COVERAGE_MIN: "53"
        run: scripts/coverage-report.sh
      - name: Upload coverage profiles
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profiles
          path: weft/coverage/
          if-no-files-found: error
