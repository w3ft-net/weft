services:
  shard-0:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-shard
      - --id=shard-0
      - --grpc-port=9000
      - --http-port=9001
      - --window-start=2026-03-28T10:00:00Z
      - --window-end=2026-03-28T11:00:00Z
      - --seed=shard-0
    ports:
      - "9000:9000"
      - "9001:9001"

  shard-1:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-shard
      - --id=shard-1
      - --grpc-port=9000
      - --http-port=9001
      - --window-start=2026-03-28T11:00:00Z
      - --window-end=2026-03-28T12:00:00Z
      - --seed=shard-1
    ports:
      - "9002:9000"
      - "9003:9001"

  compute:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-compute
      - --port=9010
      - --parallelism=2
    ports:
      - "9010:9010"

  coordinator:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-coordinator
      - --port=9020
      - --shards=shard-0=shard-0:9000=2026-03-28T10:00:00Z=2026-03-28T11:00:00Z,shard-1=shard-1:9000=2026-03-28T11:00:00Z=2026-03-28T12:00:00Z
      - --compute=compute:9010
      - --customer=kevlar
    ports:
      - "9020:9020"
    depends_on:
      - shard-0
      - shard-1
      - compute

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
