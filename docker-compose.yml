services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=weft
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shard identity is persisted in shard.json inside the volume at
  # /opt/app/data — written by the coordinator on first christening.
  # Named volumes here stand in for per-instance EBS in production.
  shard-0:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: shard
      COORDINATOR_ADDR: coordinator:9020
      HEARTBEAT_INTERVAL: "10s"
      SHARD_DATA_DIR: /opt/app/data
    volumes:
      - shard0_data:/opt/app/data
    ports:
      - "9000:9000"
      - "9001:9001"
    depends_on:
      coordinator:
        condition: service_started

  shard-1:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: shard
      COORDINATOR_ADDR: coordinator:9020
      HEARTBEAT_INTERVAL: "10s"
      SHARD_DATA_DIR: /opt/app/data
    volumes:
      - shard1_data:/opt/app/data
    ports:
      - "9002:9000"
      - "9003:9001"
    depends_on:
      coordinator:
        condition: service_started

  coordinator:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: coordinator
      WEFT_DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      WEFT_CUSTOMER: kevlar
    ports:
      - "9020:9020"
      - "9021:9021"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: api
      WEFT_DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      COORDINATOR_ADDR: coordinator:9020
      BASE_URL: http://localhost:5173
      JWT_SECRET: dev-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started

  weftd:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testapp.log:/var/log/testapp.log:ro
    depends_on:
      coordinator:
        condition: service_started

  # Second weftd, configured with a glob path over a directory of log files.
  # Reproduces the production coordinator config (path: /opt/app/logs/*.log)
  # and exercises the multi-file onboarding flow.
  weftd-glob:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-glob-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testlogs:/var/log/testlogs:ro
    depends_on:
      coordinator:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shard0_data:
  shard1_data:
