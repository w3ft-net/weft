services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft"]
      interval: 5s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-coordinator
      - --port=9020
      - --health-port=9021
      - --customer=kevlar
      - --db-dsn=host=postgres dbname=weft user=weft password=weft sslmode=disable
    ports:
      - "9020:9020"
      - "9021:9021"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weft-api
      - --port=8080
      - --coordinator=coordinator:9020
      - --db-dsn=host=postgres dbname=weft user=weft password=weft sslmode=disable
      - --base-url=http://localhost:5173
    environment:
      JWT_SECRET: dev-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started

  weftd:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-config.yaml:/etc/weftd/config.yaml:ro
    depends_on:
      coordinator:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
