services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=weft
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shards are no longer pre-declared in compose. The coordinator's
  # DockerLauncher (dev mode) spawns sibling shard containers on
  # demand, mounting per-shard subdirectories of ./dev/shard-data so
  # each shard's DuckDB + shard.json survive coordinator restarts.

  # Dedicated compute worker. Coordinator fans out rows here for
  # pipeline execution. The weft-compute binary was always built but
  # pre-2026-04 not deployed in integration — coordinator fell
  # through to in-process LocalComputePool, which meant the
  # coordinator→compute boundary was never exercised under real
  # gRPC. Putting compute on the wire gives that boundary real-
  # traffic coverage in every integration run, which is a
  # prerequisite for the direct-to-compute work (docs/plans/
  # direct-to-compute.md).
  compute:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: compute
    ports:
      - "9010:9010"

  coordinator:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: coordinator
      DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      WEFT_CUSTOMER: kevlar
      SHARD_SECRET: dev-shard-secret
      JWT_SECRET: dev-secret-change-in-production
      # Use the real gRPC compute pool instead of in-process so the
      # coordinator→compute boundary is on the wire.
      COMPUTE_ADDR: compute:9010
      # DockerLauncher config — coordinator spawns sibling shard
      # containers via the bind-mounted docker socket. Each shard's
      # DuckDB + shard.json lives in a host subdir under
      # WEFT_HOST_DATA_ROOT so a coordinator restart doesn't lose data.
      WEFT_LAUNCHER: docker
      WEFT_SHARD_IMAGE: weft-coordinator
      WEFT_DOCKER_NETWORK: weft_default
      WEFT_HOST_DATA_ROOT: ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}
      WEFT_LOCAL_DATA_ROOT: /opt/app/shard-data
      WEFT_COORDINATOR_ADDR: coordinator:9020
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}:/opt/app/shard-data
    ports:
      - "9020:9020"
      - "9021:9021"
    depends_on:
      postgres:
        condition: service_healthy
      compute:
        condition: service_started

  api:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: api
      DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      COORDINATOR_ADDR: coordinator:9020
      BASE_URL: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started

  weftd:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testapp.log:/var/log/testapp.log:ro
    depends_on:
      coordinator:
        condition: service_started

  # Second weftd, configured with a glob path over a directory of log files.
  # Reproduces the production coordinator config (path: /opt/app/logs/*.log)
  # and exercises the multi-file onboarding flow.
  weftd-glob:
    build:
      context: ..
      dockerfile: weft/Dockerfile
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-glob-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testlogs:/var/log/testlogs:ro
    depends_on:
      coordinator:
        condition: service_started

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9050:9000"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack: AWS emulator for integration tests that exercise the
  # real EC2/SNS/SQS wire format (shard EBS lifecycle — see
  # docs/plans/ebs-shard-volumes.md). Community edition covers
  # ec2/sns/sqs; ASG lifecycle hooks are Pro-only and the tests inject
  # a fake ASG client for that part.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: "ec2,sns,sqs"
      DEFAULT_REGION: us-east-2
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

