services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=weft
    environment:
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft
      POSTGRES_DB: weft
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Shards are no longer pre-declared in compose. The coordinator's
  # DockerLauncher (dev mode) spawns sibling shard containers on
  # demand, mounting per-shard subdirectories of ./dev/shard-data so
  # each shard's DuckDB + shard.json survive coordinator restarts.

  # Dedicated compute worker. The coordinator dispatches every query
  # here; compute fans out to shards, merges, and runs pipeline
  # stages. The coordinator has no in-process fallback, so this
  # service is required.
  compute:
    image: weft-server
    build:
      context: ..
      dockerfile: weft/Dockerfile
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: compute
      # Compute dials shards directly for query fan-out, so it needs
      # the SHARD_SECRET bearer (was previously passed per-request in
      # ExecuteQueryRequest; now compute reads its own env — see
      # compute.Engine.ShardSecret). Must match the value
      # on the coordinator and shard containers.
      SHARD_SECRET: dev-shard-secret
    ports:
      - "9010:9010"

  coordinator:
    image: weft-server
    # Borrowed from compute's build above, not a registry image.
    # Without this a missing weft-server makes compose attempt a pull
    # and report it as an auth failure, which reads like a credentials
    # problem instead of "the image was never built".
    pull_policy: never
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: coordinator
      DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      WEFT_ALLOW_SCHEMA_BOOTSTRAP: "1"
      WEFT_CUSTOMER: kevlar
      SHARD_SECRET: dev-shard-secret
      JWT_SECRET: dev-secret-change-in-production
      # Use the real gRPC compute pool instead of in-process so the
      # coordinator→compute boundary is on the wire.
      COMPUTE_ADDR: compute:9010
      # Cross-coordinator tail -f fan-out (docs/plans/coordinator-horizontal-scaling.md
      # item 4). Internal Docker-network port — 6380 (below) is only the
      # host-exposed mapping the bench harness reaches from outside Compose.
      REDIS_ADDR: redis:6379
      # DockerLauncher config — coordinator spawns sibling shard
      # containers via the bind-mounted docker socket. Each shard's
      # DuckDB + shard.json lives in a host subdir under
      # WEFT_HOST_DATA_ROOT so a coordinator restart doesn't lose data.
      WEFT_LAUNCHER: docker
      WEFT_SHARD_IMAGE: weft-server
      WEFT_DOCKER_NETWORK: weft_default
      WEFT_HOST_DATA_ROOT: ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}
      WEFT_LOCAL_DATA_ROOT: /opt/app/shard-data
      WEFT_COORDINATOR_ADDR: coordinator:9020
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}:/opt/app/shard-data
    ports:
      - "9020:9020"
      - "9021:9021"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compute:
        condition: service_started

  # Second coordinator instance, for manually exercising cross-coordinator
  # tail -f fan-out (docs/plans/coordinator-horizontal-scaling.md item 4):
  # ingest via `coordinator` (9020), tail -f against this one (9023) for
  # the same namespace/service, and confirm the row still arrives — it
  # only ever crosses via Redis, since this coordinator never receives it
  # locally. Identical to `coordinator` above except its host port
  # bindings (a plain `--scale coordinator=2` can't work: the `coordinator`
  # service above has fixed host ports). Not part of the default `docker
  # compose up` critical path — start explicitly when running that smoke
  # test: `docker compose up -d coordinator2`.
  #
  # profiles gates this out of a bare `up`/`up -d` (which lists no
  # service names, so Compose skips anything with a non-active
  # profile) while still letting `up -d coordinator2` start it — naming
  # a service explicitly starts it regardless of profiles. Without this,
  # CI's blanket `up -d --build` was starting a second live coordinator
  # contending for the docker socket, shard launches, and the
  # shard-fsm-leader lease alongside the primary — timing out every
  # integration test that depends on a shard actually getting launched.
  coordinator2:
    profiles: ["bench"]
    image: weft-server
    pull_policy: never
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: coordinator
      DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      WEFT_ALLOW_SCHEMA_BOOTSTRAP: "1"
      WEFT_CUSTOMER: kevlar
      SHARD_SECRET: dev-shard-secret
      JWT_SECRET: dev-secret-change-in-production
      COMPUTE_ADDR: compute:9010
      REDIS_ADDR: redis:6379
      WEFT_LAUNCHER: docker
      WEFT_SHARD_IMAGE: weft-server
      WEFT_DOCKER_NETWORK: weft_default
      WEFT_HOST_DATA_ROOT: ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}
      WEFT_LOCAL_DATA_ROOT: /opt/app/shard-data
      # Shards this coordinator ever launches (only if it wins the
      # shard-fsm-leader lease) still report to `coordinator`, not
      # itself — this dev topology's fixed shard-heartbeat address.
      WEFT_COORDINATOR_ADDR: coordinator:9020
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WEFT_HOST_DATA_ROOT:-${PWD}/dev/shard-data}:/opt/app/shard-data
    ports:
      - "9023:9020"
      - "9024:9021"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compute:
        condition: service_started

  api:
    image: weft-server
    # Borrowed from compute's build above, not a registry image.
    # Without this a missing weft-server makes compose attempt a pull
    # and report it as an auth failure, which reads like a credentials
    # problem instead of "the image was never built".
    pull_policy: never
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    environment:
      ROLE: api
      DB_DSN: host=postgres dbname=weft user=weft password=weft sslmode=disable
      COORDINATOR_ADDR: coordinator:9020
      BASE_URL: http://localhost:5173
      JWT_SECRET: dev-secret-change-in-production
      # Shared ingest-schema cache (docs/plans/cloudwatch-kinesis-subscription.md)
      # — same Valkey instance coordinator uses for tail -f fan-out, a
      # different key space. Internal Docker-network port; 6380 (below)
      # is only the host-exposed mapping.
      REDIS_ADDR: redis:6379
      STRIPE_SECRET_KEY: sk_test_51TDBfAEHO84wqJMxmG1GIgKTzDuJYWkgBFnezMCBaQcRg69vo1ZpFJCgKyFJOoYB9dqVrUiUDQMmLuj6LIiZmamy00wwE1vRih
      STRIPE_PUBLISHABLE_KEY: pk_test_51TDBfAEHO84wqJMxXOTWwZ1Grkw7eFQw3KAViuEPrJShEassrIWXMWQMUD0eaeI6D8HVNjRInLKWA3HTT4ckjuK3006aFW362Y
      STRIPE_WEBHOOK_SECRET: whsec_72a6ad2cf985245818ee5afb41431de38ce3b282849fa41013456d4b9e2109e7
      STRIPE_PRICE_SWATCH: price_1TVIFiEHO84wqJMxyfKzLG2q
      STRIPE_PRICE_SWATCH_OVERAGE: price_1TVIGLEHO84wqJMxmV3OaLRm
      STRIPE_PRICE_YARD: price_1TVIFoEHO84wqJMxtn8udm3u
      STRIPE_PRICE_YARD_OVERAGE: price_1TVIGUEHO84wqJMxA1gZa8KY
      STRIPE_PRICE_BOLT: price_1TVIFtEHO84wqJMxgZFU7avz
      STRIPE_PRICE_BOLT_OVERAGE: price_1TVIGaEHO84wqJMxbvG8kaPH
    ports:
      # Override when 8080 is taken: WEFT_API_PORT=8090 (and point the
      # frontend at it with WEFT_API_URL=http://localhost:8090).
      - "${WEFT_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_started
      redis:
        condition: service_healthy
    # api and coordinator both run goose up at startup. They depend
    # on postgres but not on each other for migrations, so they race.
    # The loser hits "relation already exists" mid-migration and
    # crashes. restart on failure means the loser's second attempt
    # finds migrations already applied and proceeds normally.
    restart: on-failure

  weftd:
    image: weft-server
    # Borrowed from compute's build above, not a registry image.
    # Without this a missing weft-server makes compose attempt a pull
    # and report it as an auth failure, which reads like a credentials
    # problem instead of "the image was never built".
    pull_policy: never
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testapp.log:/var/log/testapp.log:ro
    depends_on:
      coordinator:
        condition: service_started

  # Second weftd, configured with a glob path over a directory of log files.
  # Reproduces the production coordinator config (path: /opt/app/logs/*.log)
  # and exercises the multi-file onboarding flow.
  weftd-glob:
    image: weft-server
    # Borrowed from compute's build above, not a registry image.
    # Without this a missing weft-server makes compose attempt a pull
    # and report it as an auth failure, which reads like a credentials
    # problem instead of "the image was never built".
    pull_policy: never
    command:
      - weftd
      - --config=/etc/weftd/config.yaml
    volumes:
      - ./dev/weftd-glob-config.yaml:/etc/weftd/config.yaml:ro
      - ./dev/testlogs:/var/log/testlogs:ro
    depends_on:
      coordinator:
        condition: service_started

  # Dev/Docker stand-in for the production Lambda function URL that
  # backs LambdaColdShard. cmd/lambda-shard switches to plain HTTP
  # mode when AWS_LAMBDA_RUNTIME_API isn't set, so the same binary
  # answers parquet-cold-shard queries on :9030 here and as a
  # streaming Lambda response in prod. integration/lambda_test.go
  # depends on this; without it the cold-shard query path is only
  # unit-tested.
  lambda-shard:
    image: weft-server
    # Borrowed from compute's build above, not a registry image.
    # Without this a missing weft-server makes compose attempt a pull
    # and report it as an auth failure, which reads like a credentials
    # problem instead of "the image was never built".
    pull_policy: never
    command:
      - /usr/local/bin/lambda-shard
    environment:
      PORT: "9030"
      S3_ENDPOINT: localstack:4566
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
    ports:
      - "9030:9030"
    depends_on:
      - localstack

  # Real Pub/Sub server for the Redis-candidate half of the tail-fanout
  # benchmark (docs/plans/coordinator-horizontal-scaling.md item 4,
  # bench/tailfanout/redis.go). Valkey, not Redis Inc.'s image, to avoid
  # its post-2024 source-available licensing question entirely — same
  # wire protocol, same go-redis client. Remapped external port mirrors
  # postgres's 5433:5432 (avoid colliding with a developer's own local
  # redis-server on 6379).
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack: AWS emulator for integration tests that exercise the
  # real EC2/SNS/SQS wire format (shard EBS lifecycle — see
  # docs/plans/ebs-shard-volumes.md), and also the cold-storage S3
  # bucket (replaces the standalone MinIO container — S3 is fully
  # supported in Community, so there was no reason to run two AWS
  # emulators). Community edition covers ec2/sns/sqs/s3; ASG lifecycle
  # hooks are Pro-only and the tests inject a fake ASG client for that
  # part.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: "ec2,sns,sqs,s3"
      DEFAULT_REGION: us-east-2
      DEBUG: "0"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

