# Unit prices and measured ratios. Public AWS/Stripe list prices and numbers
# measured on weft data; nothing account-specific. Re-measure `measured` when
# the archive layout or schema changes.
aws:
  s3_standard_gb_month: 0.023
  gp3_gb_month: 0.115             # RDS storage, per the plan
stripe:
  percent: 0.029
  fixed_usd: 0.30
measured:
  bytes_per_row: 155              # raw; graybeard 122, loom 167
  parquet_ratio: 0.77             # cold Parquet bytes / raw bytes; 0.46-0.86 by org
  hot_ratio: 1.07                 # hot DuckDB bytes / raw bytes
  janitor_lag_days: 7             # archived data outlives retention by this much (logdb/janitor.go)
  # Billed Lambda dollars per billion rows scanned, from no-match greps on cold
  # archives (rows scanned approximated by rows in the window). Two orgs, two
  # points each; the spread is the point. Replace with real pairs once the
  # rows_scanned trailer has a day of traffic.
  cold_usd_per_billion_lines_low: 0.07    # weft coordinator logs: 3.8 s for 1.3M rows
  cold_usd_per_billion_lines_high: 0.94   # loom api: 34.8 s for 1.5M rows
  cron:
    raw_row_bytes: 282            # cron_results row incl. indexes
    raw_retention_days: 7
    rows_per_tick: 1.2            # average, 4 max
    rollup_gb_at_bolt_limit: 0.2  # hourly/4h/daily rollups
# One live shard's monthly cost, from the plan's attributed run-rate (list prices,
# 730 h): 4 live + 2 spare t4g.micro at $36.8, 4 x 100 GB gp3 at $32.0, ~11 root volumes at $7.0.
hot_shard:
  data_volume_gb: 100
  data_volume_usd: 8.00
  instance_usd: 6.13              # t4g.micro. t4g prices double per size: small x2, medium x4, large x8
  spares_per_live_shard: 0.5      # 2 spares for 4 live; each spare also carries a root volume
  root_volume_usd: 0.64
  fill: 1.0                       # fraction of the volume the hot data fills; prod is ~4% today, so 1.0 is the floor on cost per GB
# Dedicated (Bolt) deployments: shards that only one customer uses.
dedicated:
  fill: 0.8                       # ASSUMPTION: share of a dedicated shard's volume the hot data may fill
  spares_per_customer: 1          # one warm spare per customer, not per shard
platform:
  cell_usd_single_az: 15          # db.t4g.micro cell: instance ~11.70, 20 GB storage ~2.30, backup ~1
  cell_usd_multi_az: 29
  cell_multi_az: false            # Multi-AZ is deferred in the cells plan
  # UNMEASURED: write throughput one micro cell sustains. A placeholder that
  # prices a tier's cron load as a fraction of a cell until it is benchmarked.
  cell_rows_per_second: 100
  # UNMEASURED: ingest compute per GB, and hot-path query compute.
  ingest_usd_per_gb: 0.0
