# Multi-customer demo overlay. See docs/plans/multi-customer-demo-seed.md.
#
# Brings up 12 acme/globex service containers — 2 customers × 2 envs × 3
# apps — each running a weftd agent + a Python rate-shape generator, plus
# one loom-producer container (Loom Inc, the Go producer used in prod). Token
# values come from dev/demo/tokens.env, minted by weft-demo-seed.
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml \
#                  --env-file dev/demo/tokens.env up -d
#
# The dev/demo/up.sh wrapper runs the seed first, then this command.

x-demo-service: &demo-service
  build:
    context: ..
    dockerfile: weft/dev/demo/Dockerfile
  depends_on:
    coordinator:
      condition: service_started
  restart: unless-stopped

services:
  acme-api-sand:
    <<: *demo-service
    environment:
      SERVICE: api
      CUSTOMER: acme
      ENV: sand
      WEFTD_TOKEN: ${ACME_API_SAND_TOKEN}
      RATE_SHAPE: "const:8"
      ERROR_RATIO: "0.05"

  acme-api-prod:
    <<: *demo-service
    environment:
      SERVICE: api
      CUSTOMER: acme
      ENV: prod
      WEFTD_TOKEN: ${ACME_API_PROD_TOKEN}
      RATE_SHAPE: "sine:20,40,600"
      ERROR_RATIO: "0.08"

  acme-worker-sand:
    <<: *demo-service
    environment:
      SERVICE: worker
      CUSTOMER: acme
      ENV: sand
      WEFTD_TOKEN: ${ACME_WORKER_SAND_TOKEN}
      RATE_SHAPE: "sawtooth:2,0.05,12"
      ERROR_RATIO: "0.05"

  acme-worker-prod:
    <<: *demo-service
    environment:
      SERVICE: worker
      CUSTOMER: acme
      ENV: prod
      WEFTD_TOKEN: ${ACME_WORKER_PROD_TOKEN}
      RATE_SHAPE: "sine:5,10,300"
      ERROR_RATIO: "0.05"

  acme-edge-sand:
    <<: *demo-service
    environment:
      SERVICE: edge
      CUSTOMER: acme
      ENV: sand
      WEFTD_TOKEN: ${ACME_EDGE_SAND_TOKEN}
      RATE_SHAPE: "const:3"
      ERROR_RATIO: "0.05"

  acme-edge-prod:
    <<: *demo-service
    environment:
      SERVICE: edge
      CUSTOMER: acme
      ENV: prod
      WEFTD_TOKEN: ${ACME_EDGE_PROD_TOKEN}
      RATE_SHAPE: "sine:10,15,180"
      ERROR_RATIO: "0.05"

  globex-orders-staging:
    <<: *demo-service
    environment:
      SERVICE: orders
      CUSTOMER: globex
      ENV: staging
      WEFTD_TOKEN: ${GLOBEX_ORDERS_STAGING_TOKEN}
      RATE_SHAPE: "sawtooth:1,0.02,8"
      ERROR_RATIO: "0.05"

  globex-orders-prod:
    <<: *demo-service
    environment:
      SERVICE: orders
      CUSTOMER: globex
      ENV: prod
      WEFTD_TOKEN: ${GLOBEX_ORDERS_PROD_TOKEN}
      RATE_SHAPE: "sine:30,60,900"
      ERROR_RATIO: "0.05"

  globex-billing-staging:
    <<: *demo-service
    environment:
      SERVICE: billing
      CUSTOMER: globex
      ENV: staging
      WEFTD_TOKEN: ${GLOBEX_BILLING_STAGING_TOKEN}
      RATE_SHAPE: "monotonic:1,0.02"
      ERROR_RATIO: "0.12"

  globex-billing-prod:
    <<: *demo-service
    environment:
      SERVICE: billing
      CUSTOMER: globex
      ENV: prod
      WEFTD_TOKEN: ${GLOBEX_BILLING_PROD_TOKEN}
      RATE_SHAPE: "monotonic:5,0.05,40"
      ERROR_RATIO: "0.10"

  globex-notifier-staging:
    <<: *demo-service
    environment:
      SERVICE: notifier
      CUSTOMER: globex
      ENV: staging
      WEFTD_TOKEN: ${GLOBEX_NOTIFIER_STAGING_TOKEN}
      RATE_SHAPE: "const:4"
      ERROR_RATIO: "0.05"

  globex-notifier-prod:
    <<: *demo-service
    environment:
      SERVICE: notifier
      CUSTOMER: globex
      ENV: prod
      WEFTD_TOKEN: ${GLOBEX_NOTIFIER_PROD_TOKEN}
      RATE_SHAPE: "sine:8,16,420"
      ERROR_RATIO: "0.05"

  # Loom Inc — the populated demo org used by the onboarding tour. New
  # signups get a read-only membership in this customer; the tour walks
  # them through these streams. Unlike acme/globex (Python generator, one
  # container per app), Loom runs the SAME Go cmd/loom-producer as the prod
  # producer host: one container writes all six streams from
  # deploy/loom-producer/streams.yaml — trace ID as field 3 of every line,
  # plus checkout chains hopping api -> edge -> worker under one trace ID,
  # which the tour's trace lessons follow — and two weftd forwarders ship
  # them under the per-env tokens (LOOM_PROD_TOKEN / LOOM_SAND_TOKEN).
  loom-producer:
    build:
      context: ..
      dockerfile: weft/dev/demo/Dockerfile.loom
    depends_on:
      coordinator:
        condition: service_started
    restart: unless-stopped
    environment:
      LOOM_PROD_TOKEN: ${LOOM_PROD_TOKEN}
      LOOM_SAND_TOKEN: ${LOOM_SAND_TOKEN}
