app:
  name: weft
  region: us-east-2
  type: go
  entrypoint_role: coordinator
  additional_roles:
    shard-small: shard-small
    compute: compute
  account_id: "220664822695"
  infrastructure_live_dir: /Users/paul/dev/infrastructure-live

build:
  packer_template: packer/weft.pkr.hcl
  base_packer_template: packer/weft-base.pkr.hcl
  base_ami_pattern: "debian-12-base-weft-arm64-*"
  architecture: arm64                  # Graviton — matches t4g instance_type below
  instance_type: t4g.xlarge            # DuckDB CGO compilation needs more RAM
  skip_local_build: true
  prebuild:
    - name: Create build tarball with warp dependency
      run: |
        cd ..
        tar czf /tmp/app-source.tar.gz \
          --exclude='.git' --exclude='node_modules' --exclude='*.duckdb' \
          --exclude='weft/weft' --exclude='weft/server' --exclude='weft/bin' \
          weft warp

# Run after a successful prod deploy. The collapse target folds the
# now-applied migrations into store/schema.sql so a virgin DB matches
# prod's schema (and goose_db_version ledger) by construction. See
# docs/plans/migration-collapse.md.
#
# on_error: warn — the deploy itself already succeeded; if the local
# `make collapse` or its commit/push trips, that's a housekeeping fix-
# up, not grounds to roll the deploy back.
post_deploy:
  - name: Collapse migrations through the just-deployed AMI
    run: make collapse
    commit:
      paths: [store/schema.sql, store/migrations/]
      message: "store: collapse migrations through the just-deployed AMI"
      on_error: warn
