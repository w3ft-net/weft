app:
  name: weft
  region: us-east-2
  type: go
  entrypoint_role: coordinator
  additional_roles:
    shard-small: shard-small
    compute: compute
  account_id: "220664822695"
  infrastructure_live_dir: /Users/paul/dev/infrastructure-live

build:
  packer_template: packer/weft.pkr.hcl
  base_packer_template: packer/weft-base.pkr.hcl
  base_ami_pattern: "debian-12-base-weft-*"
  instance_type: t4g.xlarge  # DuckDB CGO compilation needs more RAM
  skip_local_build: true
  prebuild:
    - name: Create build tarball with warp dependency
      run: |
        cd ..
        tar czf /tmp/app-source.tar.gz \
          --exclude='.git' --exclude='node_modules' --exclude='*.duckdb' \
          --exclude='weft/weft' --exclude='weft/server' --exclude='weft/bin' \
          weft warp
