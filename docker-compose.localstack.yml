# Compose overlay providing LocalStack for integration tests that exercise
# real AWS-SDK call paths (SNS, SQS, EC2). Off by default — the everyday
# dev stack does not need it. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.localstack.yml \
#       up -d --build
#   go test -tags integration ./integration/ -count=1 -timeout 5m
#
# scripts/integration-test.sh wires the overlay automatically. ASG isn't
# in LocalStack Community, so tests stub that one client; everything
# else (SNS/SQS/EC2) goes through the real aws-sdk-go-v2 request path
# against this container.

services:
  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,ec2
      DEBUG: "0"
      # Default region must match awsTestConfig() in lifecycle_test.go.
      AWS_DEFAULT_REGION: us-east-2
      # Skip the official-image welcome banner so logs stay readable.
      DISABLE_EVENTS: "1"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
